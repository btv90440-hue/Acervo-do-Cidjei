<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#eef1f2">
  <title>Acervo do CIDJEI · seus filmes, catalogados</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@700;800&family=Share+Tech+Mono&display=swap"
    rel="stylesheet">
  
  <style>
    :root {
      --bg: #eef1f2;
      --card: #f8fafb;
      --ink: #182026;
      --mut: #596a75;
      --line: #cfd8dc;
      --grn: #a82b2b; /* Vermelho Daniel (Anatomy of a Fall) */
      --grn-blue: #2b4c7e; /* Azul Tribunal / Gendarmeria */
      --sans: 'Space Grotesk', system-ui, sans-serif;
      --mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
      --display-font: Georgia, 'Times New Roman', serif;
      --timer-font: 'JetBrains Mono', monospace;
      color-scheme: light
    }

    * {
      box-sizing: border-box;
      margin: 0
    }

    [hidden] {
      display: none !important
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font: 400 17px/1.5 var(--sans);
      -webkit-font-smoothing: antialiased
    }

    button,
    input,
    select {
      font: inherit;
      color: inherit
    }

    button {
      cursor: pointer
    }

    :focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 3px
    }

    .lbl {
      font: 400 12px var(--timer-font);
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--mut)
    }

    .sm {
      font: 400 12px/1.6 var(--mono);
      color: var(--mut)
    }

    .wrap {
      max-width: 1320px;
      margin: auto;
      padding: 0 28px
    }

    header {
      position: sticky;
      top: 0;
      z-index: 5;
      background: color-mix(in srgb, var(--bg) 92%, transparent);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line)
    }

    header .wrap {
      display: flex;
      align-items: center;
      gap: 14px;
      height: 94px
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      font-weight: 700;
      font-size: 22px;
      letter-spacing: -.02em;
      margin-right: auto;
      color: inherit;
      text-decoration: none
    }

    .brand small {
      font: 500 11px var(--mono);
      letter-spacing: .2em;
      color: var(--mut);
      align-self: flex-end;
      margin-bottom: 6px
    }

    nav {
      display: flex;
      gap: 6px;
      margin-right: 12px
    }

    nav a {
      color: inherit;
      text-decoration: none;
      padding: 8px 12px;
      font-size: 16px
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      border: 1px solid var(--line);
      background: var(--card);
      border-radius: 8px;
      padding: 0 22px;
      height: 48px;
      font-weight: 500;
      font-size: 16px;
      white-space: nowrap
    }

    .pill.me {
      padding: 0 22px 0 6px
    }

    .pill i {
      width: 36px;
      height: 36px;
      border-radius: 6px;
      background: var(--ink);
      color: #fff;
      display: grid;
      place-items: center;
      font-style: normal;
      font-size: 20px
    }

    .pill.k,
    .btn.k {
      background: var(--grn);
      color: #fff;
      border-color: var(--grn)
    }

    .pill.big {
      height: 60px;
      padding: 0 34px;
      font-size: 18px
    }

    .btn {
      height: 76px;
      padding: 0 44px;
      font-size: 20px;
      font-weight: 500;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--card)
    }

    .hero {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 64px;
      align-items: center;
      padding: 84px 0 72px
    }

    h1 {
      font-size: clamp(42px, 6vw, 76px);
      line-height: 1.05;
      letter-spacing: -.045em;
      font-weight: 700;
      margin: 26px 0 30px
    }

    .intro {
      font-size: 21px;
      color: var(--mut);
      max-width: 600px;
      margin-bottom: 38px
    }

    .acts {
      display: flex;
      gap: 16px;
      flex-wrap: wrap
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px
    }

    .stat {
      padding: 34px 36px
    }

    .stat .lbl {
      margin-bottom: 12px
    }

    .stat p {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 0;
      border-bottom: 1px solid var(--line);
      font-size: 19px
    }

    .stat b {
      font: 500 20px var(--mono)
    }

    .lnk {
      background: none;
      border: 0;
      border-bottom: 1px solid;
      border-radius: 0;
      padding: 0;
      font: 400 14px var(--mono);
      letter-spacing: .04em;
      color: inherit;
      text-decoration: none;
      cursor: pointer
    }

    .stat .lnk {
      display: inline-block;
      margin-top: 22px
    }

    h2.big {
      font-size: 17px;
      letter-spacing: .16em;
      color: var(--ink);
      margin-bottom: 22px;
      scroll-margin-top: 110px
    }

    .tools {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px
    }

    .tools input,
    .tools select {
      height: 48px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--card);
      padding: 0 22px;
      outline: 0
    }

    .tools input {
      flex: 1;
      min-width: 220px
    }

    .tools input:focus,
    .tools select:focus {
      border-color: var(--grn)
    }

    .chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap
    }

    #gc {
      margin-bottom: 28px
    }

    .chip {
      display: inline-flex;
      align-items: center;
      height: 36px;
      padding: 0 16px;
      border-radius: 6px;
      background: color-mix(in srgb, var(--line) 40%, transparent);
      font: 400 14px var(--mono);
      letter-spacing: .04em;
      border: 1px solid transparent
    }

    .chip.g {
      background: var(--card);
      border-color: var(--grn);
      color: var(--grn)
    }

    .chip.s {
      height: 26px;
      padding: 0 10px;
      font-size: 12px
    }

    button.chip.on {
      background: var(--grn);
      color: #fff
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 22px;
      padding-bottom: 90px
    }

    .mv {
      overflow: hidden;
      cursor: pointer;
      transition: transform .2s, border-color .2s
    }

    .mv:hover {
      transform: translateY(-4px);
      border-color: var(--grn)
    }

    .po {
      position: relative;
      aspect-ratio: 2/3;
      background: color-mix(in srgb, var(--line) 50%, transparent);
      display: grid;
      place-items: center;
      padding: 18px;
      text-align: center;
      font: 400 12px var(--mono);
      color: var(--mut);
      word-break: break-word
    }

    .po img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover
    }

    .mb {
      padding: 16px 18px 18px
    }

    .mb h3 {
      font-size: 18px;
      line-height: 1.2;
      letter-spacing: -.02em;
      font-weight: 600;
      margin-bottom: 10px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden
    }

    .mb div {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font: 400 12px var(--mono);
      color: var(--mut)
    }

    .empty {
      grid-column: 1/-1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      flex-wrap: wrap;
      padding: 32px
    }

      font-size: 34px;
      letter
