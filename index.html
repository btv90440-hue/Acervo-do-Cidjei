<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#eef1f2">
  <title>Acervo do CIDJEI · seus filmes, catalogados</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;1,400&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  
  <style>
    /* VARIABLES & THEMES */
    /* Light Theme: Anatomy of a Fall (2023) - Frio alpino, ardósia e vermelho-gorro */
    :root {
      --bg: #eef1f2;
      --card: #f8fafb;
      --ink: #182026;
      --mut: #596a75;
      --line: #cfd8dc;
      --grn: #a82b2b; /* Acento primário: Vermelho Daniel */
      --soft: #e2e8eb;
      --glow: #a82b2b;
      --sans: 'Space Grotesk', system-ui, sans-serif;
      --mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
      color-scheme: light;
    }

    /* Dark Theme: La Haine (1995) - Preto e Branco de alto contraste 35mm */
    html[data-theme="matrix"] {
      --bg: #0a0a0a;
      --card: #141414;
      --ink: #f0f0f0;
      --mut: #888888;
      --line: #2a2a2a;
      --grn: #ffffff; /* Acento primário: Branco puro */
      --soft: #222222;
      --glow: #ffffff;
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
      margin: 0;
    }

    [hidden] {
      display: none !important;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font: 400 17px/1.5 var(--sans);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      transition: background .35s, color .35s;
    }

    body:before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -1;
      background: radial-gradient(ellipse at 86% 4%, color-mix(in srgb, var(--glow) 8%, transparent), transparent 48%),
                  linear-gradient(90deg, transparent 97%, color-mix(in srgb, var(--grn) 4%, transparent) 98%);
      background-size: auto, 40px 40px;
    }

    button,
    input,
    select {
      font: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
    }

    :focus-visible {
      outline: 2px solid var(--grn);
      outline-offset: 3px;
    }

    .lbl {
      font: 400 12px var(--mono);
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--mut);
    }

    .sm {
      font: 400 12px/1.6 var(--mono);
      color: var(--mut);
    }

    .wrap {
      max-width: 1320px;
      margin: auto;
      padding: 0 28px;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 5;
      background: color-mix(in srgb, var(--bg) 92%, transparent);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--line);
    }

    header .wrap {
      display: flex;
      align-items: center;
      gap: 14px;
      height: 82px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      font-size: 20px;
      letter-spacing: -.03em;
      margin-right: auto;
      color: inherit;
      text-decoration: none;
    }

    .brand svg {
      color: var(--grn);
    }

    .brand:after {
      content: "/ ANATOMIE D'UNE CHUTE";
      font: 10px var(--mono);
      letter-spacing: .14em;
      color: var(--mut);
      align-self: flex-end;
      margin-bottom: 3px;
    }

    html[data-theme="matrix"] .brand:after {
      content: "/ LA HAINE (1995)";
    }

    nav {
      display: flex;
      gap: 6px;
      margin-right: 12px;
    }

    nav a {
      color: var(--mut);
      text-decoration: none;
      padding: 8px 12px;
      font-size: 14px;
      border-radius: 6px;
      transition: background .2s, color .2s;
    }

    nav a:hover {
